 let h='<span class="num">'+d.getDate()+'</span>';
 const order=['day','option','flight','hotel','ticket','travel','deadline'];
 const sorted=[...list].sort((a,c)=>order.indexOf(a.k)-order.indexOf(c.k));
 sorted.slice(0,3).forEach(e=>{h+='<span class="chip '+cls(e)+'" title="'+esc(e.t)+'">'+esc(e.k==='day'?e.t+': '+e.d:e.t)+'</span>'});
 if(sorted.length>3)h+='<div class="more">+'+(sorted.length-3)+' more</div>';
 b.innerHTML=h;b.addEventListener('click',()=>{sel=k;draw()});return b;
}
function draw(){
 const m=MON[mi],first=new Date(m[0],m[1],1),start=new Date(first);start.setDate(1-first.getDay());
 document.getElementById('months').innerHTML='';
 MON.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x[2]+' '+x[0];if(i===mi)b.className='on';b.addEventListener('click',()=>{mi=i;draw()});document.getElementById('months').appendChild(b)});
 const g=document.getElementById('grid');g.innerHTML='';
 ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>{const d=document.createElement('div');d.className='dow';d.textContent=n;g.appendChild(d)});
 const last=new Date(m[0],m[1]+1,0);const weeks=Math.ceil((first.getDay()+last.getDate())/7);
 for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);g.appendChild(cell(d,d.getMonth()===m[1]))}
 const p=document.getElementById('panel');
 if(!sel){p.innerHTML='<h2>Pick a date</h2><p class="legend">Everything on that date is listed here.</p>';return}
 const dt=new Date(sel+'T12:00:00'),items=(E[sel]||[]);
 let h='<h2>'+dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</h2>';
 if(!items.length)h+='<p class="legend">Nothing planned.</p>';
 items.forEach(e=>{
  let line='<div class="item"><span class="sw '+cls(e)+'"></span><div><b>'+(e.u?'<a href="'+e.u+'">'+esc(e.t)+'</a>':esc(e.t))+'</b>'
   +'<small>'+esc(KINDS[e.k][0])+(e.d?': '+esc(e.d):'')+'</small>';
  if(e.night)line+='<small>Night: '+esc(e.night)+(e.booked?' (booked)':' (tentative)')+(e.car?' &middot; car day':'')+'</small>';
  h+=line+'</div></div>';
 });
 p.innerHTML=h;
}
const f=document.getElementById('filters');
Object.keys(KINDS).forEach(k=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" checked><span class="sw k-'+k+'"></span>'+KINDS[k][0];l.querySelector('input').addEventListener('change',e=>{e.target.checked?on.add(k):on.delete(k);draw()});f.appendChild(l)});
sel=(function(){const t=iso(today);return E[t]?t:'2026-12-02'})();
draw();
</script></body></html>
