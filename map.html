function show(ll,r,title,extra,url){
  if(popup)popup.remove();
  popup=new maplibregl.Popup({offset:14,maxWidth:'280px'}).setLngLat(ll).setHTML('<b>'+esc(title)+'</b><br>'+esc(r.label)+(r.date?' &middot; '+esc(r.date):'')+(extra?'<br>'+esc(extra):'')+'<br><a href="index.html#'+r.id+'">Open this day</a> &middot; <a href="'+(url||('https://www.google.com/maps/search/?api=1&query='+ll[1]+','+ll[0]))+'" target="_blank" rel="noopener">'+(url?'Open the place in Google Maps':'Google Maps (coordinates)')+'</a>').addTo(map);
}
function fit(){
  const b=new maplibregl.LngLatBounds();let any=false;
  visible().forEach(i=>{R[i].lines.forEach(l=>l.pts.forEach(p=>{b.extend([p[1],p[0]]);any=true}));R[i].marks.forEach(m=>{b.extend([m.lng,m.lat]);any=true})});
  if(any)map.fitBounds(b,{padding:{top:50,bottom:50,left:50,right:50},duration:600,maxZoom:15});
}
function renderDays(){
  const box=document.getElementById('days');box.innerHTML='';
  days.forEach(r=>{
    const b=document.createElement('button');b.type='button';b.className='day'+(state.sel===r.id?' on':'');
    b.innerHTML='<span class="sw" style="background:'+col(r.c)+'"></span><span><b>'+esc(r.label)+'</b><em>'+esc(r.date)+'</em><small>'+esc(r.what)+'</small></span>';
    b.addEventListener('click',()=>select(state.sel===r.id?null:r.id));box.appendChild(b);
    if(state.sel===r.id){const ul=document.createElement('ul');ul.className='stops';
      r.marks.forEach(m=>{const li=document.createElement('li');li.innerHTML='<span class="n" style="background:'+col(r.c)+'">'+esc(m.n)+'</span><span>'+esc(m.name)+'</span>';
        li.addEventListener('click',()=>{map.flyTo({center:[m.lng,m.lat],zoom:Math.max(map.getZoom(),13)});show([m.lng,m.lat],r,m.name,'',m.url);document.body.classList.remove('show-panel')});ul.appendChild(li)});
      box.appendChild(ul)}
  });
}
function select(id,noFit){
  state.sel=id;if(popup)popup.remove();
  try{history.replaceState(null,'',id?'#'+id:location.pathname+location.search)}catch(e){}
  renderDays();applyFilters();if(!noFit)fit();
  const el=document.querySelector('.day.on');if(el)el.scrollIntoView({block:'nearest'});
}
function renderFilters(){
  const box=document.getElementById('filters');
  const sw={car:'',rail:'',city:'thin',walk:'dash thin',other:'dash thin'};
  KINDS.forEach(k=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" checked><span class="sw '+sw[k[0]]+'"></span>'+esc(k[1]);
    l.querySelector('input').addEventListener('change',e=>{e.target.checked?state.kinds.add(k[0]):state.kinds.delete(k[0]);applyFilters()});box.appendChild(l)});
}
function search(){
  const q=document.getElementById('q').value.trim().toLowerCase(),ul=document.getElementById('hits');ul.innerHTML='';
  if(q.length<2)return;const seen=new Set();let n=0;
  for(const r of R){if(r.alt)continue;for(const m of r.marks){const k=m.name.toLowerCase();if(k.includes(q)&&!seen.has(k)&&n<8){seen.add(k);n++;
    const li=document.createElement('li');li.innerHTML=esc(m.name)+' <small>'+esc(r.label)+'</small>';
    li.addEventListener('click',()=>{select(r.id,true);map.flyTo({center:[m.lng,m.lat],zoom:14});show([m.lng,m.lat],r,m.name,'',m.url);ul.innerHTML='';document.body.classList.remove('show-panel')});ul.appendChild(li)}}}
}
fetch('https://tiles.openfreemap.org/styles/liberty').then(r=>r.json()).then(style=>{
  // English or romanised labels only: prefer name_en, then the Latin transliteration, never the Japanese script
  style.layers.forEach(l=>{const t=l.layout&&l.layout['text-field'];if(t&&JSON.stringify(t).includes('name_en')){l.layout['text-field']=['case',['has','name:nonlatin'],['coalesce',['get','name:latin'],''],['coalesce',['get','name_en'],['get','name:latin'],['get','name']]]}});
  map=new maplibregl.Map({container:'map',style,center:[137,36.5],zoom:4.6,attributionControl:{compact:true}});
  window._map=map;
  map.addControl(new maplibregl.NavigationControl({visualizePitch:false}),'top-right');map.addControl(new maplibregl.ScaleControl({unit:'metric'}));map.addControl(new maplibregl.FullscreenControl(),'top-right');
  map.on('load',()=>{
    map.addSource('lines',{type:'geojson',data:lineF});map.addSource('stops',{type:'geojson',data:stopF});
    const w=['match',['get','kind'],['shinkansen','express','rail'],4,'drive',5,['subway','tram','bus','cable'],3.5,'walk',3,2.5];
    map.addLayer({id:'casing',type:'line',source:'lines',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#fff','line-opacity':.85,'line-width':['+',w,3]}});
    map.addLayer({id:'lines',type:'line',source:'lines',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':['get','c'],'line-width':w,'line-opacity':.95}});
    map.addLayer({id:'dashed',type:'line',source:'lines',layout:{'line-join':'round'},paint:{'line-color':['get','c'],'line-width':w,'line-opacity':.95,'line-dasharray':[2,1.6]}});
    map.addLayer({id:'dots',type:'circle',source:'stops',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,3,10,5,14,7],'circle-color':['get','c'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});
    ['dots','lines','dashed'].forEach(id=>{map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='')});
    map.on('click','dots',e=>{const f=e.features[0],r=R[f.properties.r];show(f.geometry.coordinates.slice(),r,f.properties.name,'',f.properties.url)});
    map.on('click',['lines','dashed'],e=>{if(map.queryRenderedFeatures(e.point,{layers:['dots']}).length)return;const f=e.features[0],r=R[f.properties.r];show([e.lngLat.lng,e.lngLat.lat],r,f.properties.kind.replace(/^./,c=>c.toUpperCase())+' leg',f.properties.label)});
    const h=location.hash.slice(1);select(days.some(d=>d.id===h)?h:null);
    if(!h)fit();
    map.once('idle',()=>{document.body.setAttribute('data-map','ready')});
  });
});
renderFilters();renderDays();
document.getElementById('all').addEventListener('click',()=>select(null));
document.getElementById('alts').addEventListener('change',e=>{state.alts=e.target.checked;applyFilters();if(state.sel)fit()});
document.getElementById('q').addEventListener('input',search);
document.getElementById('toggle-panel').addEventListener('click',()=>{const o=document.body.classList.toggle('show-panel');document.getElementById('toggle-panel').setAttribute('aria-expanded',o?'true':'false')});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(map&&map.getLayer('lines'))select(days.some(d=>d.id===h)?h:null)});
</script></body></html>
